<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Portal</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #141414;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-card {
            background-color: #000000;
            border: 1px solid #333333;
            border-radius: 8px;
            padding: 30px;
            width: 360px;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.2);
        }

        /* Tab Switcher */
        .tab-buttons {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #333;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .tab-btn.active {
            color: #e50914; /* Red theme */
            border-bottom: 3px solid #e50914;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ccc;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #e50914;
        }

        /* Checkbox & License Agreement */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #aaa;
        }

        .checkbox-group input {
            accent-color: #e50914;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #e50914;
            text-decoration: none;
        }

        /* Primary Red Button */
        .btn-red {
            width: 100%;
            padding: 12px;
            background-color: #e50914;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-red:hover {
            background-color: #b80710;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <!-- Tabs -->
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('login')">Log In</button>
            <button class="tab-btn" onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- Log In Form -->
        <form id="loginForm" onsubmit="handleAuth(event, 'Login')">
            <div class="form-group">
                <label>Username / Email</label>
                <input type="text" required placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-red">Log In</button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden" onsubmit="handleAuth(event, 'Registration')">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" required placeholder="Enter full name">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" required placeholder="Enter email">
            </div>
            <div class="form-group">
                <label>Create Password</label>
                <input type="password" required placeholder="Create password">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">I accept the <a href="#">Terms & License Agreement</a></label>
            </div>

            <button type="submit" class="btn-red">Create Account</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const buttons = document.querySelectorAll('.tab-btn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                buttons[0].classList.add('active');
                buttons[1].classList.remove('active');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                buttons[0].classList.remove('active');
                buttons[1].classList.add('active');
            }
        }

        function handleAuth(event, type) {
            event.preventDefault();
            alert(type + ' successful!');
        }
    </script>
</body>
</html>
